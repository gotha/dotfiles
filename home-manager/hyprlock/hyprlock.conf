# Nord, to match ../mako/config.

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(88c0d0)
    inner_color = rgb(2e3440)
    font_color = rgb(d8dee9)
    check_color = rgb(ebcb8b)
    fail_color = rgb(bf616a)
    fade_on_empty = false
    placeholder_text = <i>Mr. Anderson...</i>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Hack Nerd Font
    font_size = 72
    color = rgb(eceff4)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    font_family = Hack Nerd Font
    font_size = 20
    color = rgb(d8dee9)
    position = 0, 50
    halign = center
    valign = center
}
