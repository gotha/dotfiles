# Timings carried over from the swayidle line in ../sway/config.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Back to the first layout before locking, so the password is not typed in
# Bulgarian.
listener {
    timeout = 299
    on-timeout = hyprctl switchxkblayout all 0
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
