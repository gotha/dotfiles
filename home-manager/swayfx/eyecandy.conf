
# --- swayfx ---------------------------------------------------------------
# Appended after ../sway/config, so everything here wins over it. Only swayfx
# understands these commands; vanilla sway refuses to start on them, which is
# why they live in this module and not in the shared config.

gaps inner 8
smart_gaps on

corner_radius 10
smart_corner_radius on

shadows enable
shadow_blur_radius 20
shadow_color #000000a0

# ../sway/config sets `default_border none`, so there is no focus ring to see.
# Dimming everything else is what replaces it.
default_dim_inactive 0.15

# Open/close, move/resize and workspace switch. 250ms is upstream's suggestion.
animation_duration_ms 250

# Blur only shows through surfaces that are already translucent. waybar's
# upstream style.css is rgba(..., 0.5), so the bar blurs out of the box;
# kitty and alacritty sit at 0.98 opacity, so drop those to ~0.85 in
# ../kitty/kitty.conf or ../alacritty/alacritty.toml to see it behind a terminal.
blur enable
blur_passes 2
blur_radius 5

layer_effects "waybar" {
    blur enable;
    blur_ignore_transparent enable;
    corner_radius 6;
    shadows enable;
}
