# Hyprland config for h4kbox.
#
# Deliberately a near-translation of ../sway/config: same $mod, same home-row
# focus keys, same workspace numbers, same window assignments, so muscle memory
# carries over between devbox (sway) and h4kbox (Hyprland).
#
# {{TERMINAL}} is substituted by ./default.nix from
# programs.hyprland.custom.terminal.

### Variables

$mod = SUPER
$left = H
$down = J
$up = K
$right = L
$term = {{TERMINAL}}
$menu = rofi -show combi -show-icons

### Monitors
#
# preferred,auto,1 keeps this working unchanged in a qemu VM, where the mode is
# whatever virtio-gpu advertises and changes when the window is resized.

monitor = , preferred, auto, 1

### Input
#
# Matches sway's `input type:keyboard`. The per-device stanzas in sway/config
# (Ducky, Keychron, Apple internal) are not reproduced: Hyprland matches on its
# own device names rather than sway's vendor:product:name identifiers, and those
# have to be read off `hyprctl devices` on the machine in question. Add them as
#
#   device (
#     name = <name from hyprctl devices>
#     kb_layout = keychron-k6,bg
#   )
#
# keyd already normalises CapsLock at the evdev level on this host, so
# caps:escape here is only for the case where keyd is not running.

input {
    kb_layout = us,bg
    kb_options = grp:win_space_toggle,caps:escape

    repeat_delay = 250
    repeat_rate = 45

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

### Look and feel

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # sway ran with `default_border none`; a thin border is more useful under
    # dwindle, where the split direction is otherwise invisible.
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Animations off by default: this distro is expected to spend time in a qemu VM
# on llvmpipe, where they are the difference between usable and not. Flip to
# true on real hardware.
animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Hyprland otherwise pulls focus to whatever window asks for it.
    focus_on_activate = false
}

# Software cursors. Hardware cursor planes are unreliable on virtio-gpu, which
# shows up as an invisible or stuck pointer in the VM. The cost on real hardware
# is negligible.
cursor {
    no_hardware_cursors = true
}

# Ignored where a real GPU is present, needed where Mesa falls back to llvmpipe.
env = WLR_RENDERER_ALLOW_SOFTWARE,1
# Custom xkb layouts from ../sway/.xkb are installed to ~/.xkb by default.nix.
env = XKB_CONFIG_EXTRA_PATH,$HOME/.xkb

### Key bindings - basics

bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, $menu
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exit

# sway's `floating_modifier $mod normal`
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

### Focus

bind = $mod, $left, movefocus, l
bind = $mod, $down, movefocus, d
bind = $mod, $up, movefocus, u
bind = $mod, $right, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

### Move windows

# movewindoworgroup rather than movewindow: with groups bound below, moving a
# window toward one puts it into the group, which is what sway does when you
# move a window into a tabbed container.
bind = $mod SHIFT, $left, movewindoworgroup, l
bind = $mod SHIFT, $down, movewindoworgroup, d
bind = $mod SHIFT, $up, movewindoworgroup, u
bind = $mod SHIFT, $right, movewindoworgroup, r
bind = $mod SHIFT, Left, movewindoworgroup, l
bind = $mod SHIFT, Down, movewindoworgroup, d
bind = $mod SHIFT, Up, movewindoworgroup, u
bind = $mod SHIFT, Right, movewindoworgroup, r

### Workspaces

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

### Layout
#
# togglesplit, swapsplit, movetoroot and preselect are layoutmsg subcommands in
# dwindle, not dispatchers of their own - `bind = $mod, E, togglesplit` is
# silently rejected as an unknown dispatcher.
#
# sway's splith/splitv set the direction the *next* window opens in, which is
# what dwindle calls preselect. r and d match sway's horizontal and vertical.

bind = $mod, B, layoutmsg, preselect r
bind = $mod, V, layoutmsg, preselect d
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, F, fullscreen
bind = $mod SHIFT, space, togglefloating

# i3 and sway's tabbed layout is a Hyprland group: several windows in one slot,
# drawn as tabs, cycled rather than tiled. changegroupactive walks the tabs the
# way $mod+$left/$right walks a tabbed container in i3.
bind = $mod, W, togglegroup
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b

# No counterpart, left unbound rather than bound to something that only looks
# similar:
#   $mod+s      stacking - dwindle has tabs (groups) but no stacked layout
#   $mod+a      focus parent - dwindle has no addressable parent container
#   $mod+space  focus mode_toggle - no tiling/floating focus swap dispatcher
#
# pseudo is dwindle's own trick, not a sway binding, so it stays off $mod+P -
# see the screenshot section, which is where sway had that key.

### Scratchpad
#
# sway's scratchpad, as a Hyprland special workspace.

bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad

### Resize
#
# sway used a `resize` mode; Hyprland calls the same thing a submap.

bind = $mod, R, submap, resize

submap = resize
binde = , $left, resizeactive, -20 0
binde = , $down, resizeactive, 0 20
binde = , $up, resizeactive, 0 -20
binde = , $right, resizeactive, 20 0
binde = , Left, resizeactive, -20 0
binde = , Down, resizeactive, 0 20
binde = , Up, resizeactive, 0 -20
binde = , Right, resizeactive, 20 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

### Screenshot
#
# Same key and same behaviour as sway: select a region, copy to clipboard.

bind = $mod, P, exec, grim -g "$(slurp -d)" - | wl-copy

### Dictation
#
# Mod5 is AltGr. Under us(altgr-intl) AltGr+i produces `idiaeresis`, so the bind
# is on the physical key via the code: form, which is Hyprland's equivalent of
# sway's --to-code.

bind = MOD5, code:31, exec, dictate-hotkey
windowrulev2 = float, title:^(Dictation)$

### Media keys
#
# bindl fires even when the session is locked; bindel also repeats when held.
# $WOBSOCK is not available here the way it is in sway, so these skip the wob
# readout and rely on the bar for feedback.

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# sway bound XF86Search to bemenu-run, but bemenu is in no package list in this
# repo - the binding has been dead there. Pointed at $menu instead, which is the
# launcher that is actually installed.
bind = , XF86Search, exec, $menu

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

### Window assignments
#
# sway's `assign [app_id=...] workspace number N`.

windowrulev2 = workspace 2, class:^(kitty)$
windowrulev2 = workspace 2, class:^(Alacritty)$
windowrulev2 = workspace 3, class:^(Slack)$
windowrulev2 = workspace 4, class:^(Spotify)$
windowrulev2 = workspace 4, class:^(1Password)$
windowrulev2 = workspace 4, class:^(transmission-gtk)$

### Autostart
#
# quickshell is the bar and replaces waybar. hyprpaper draws the wallpaper,
# which sway did itself via `output * bg`.

exec-once = hyprpaper
exec-once = quickshell
exec-once = hypridle
exec-once = 1password
exec-once = {{TERMINAL}}
exec-once = firefox
